[project]
name = "kei-animator"
version = "0.1.0"
description = "Kei Animator, by Castforge: an animation agent that keys motion by hand, stage by stage."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.scripts]
kei = "kei.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole kei folder ships, data files included: the default rule book is kei/book/*.md.
packages = ["kei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["maya: needs Maya (mayapy); skipped with the reason when Maya is not found"]
