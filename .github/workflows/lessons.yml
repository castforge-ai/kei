name: lessons
# A pull request that adds a shared lesson gets the same bundle checks the review page runs, before a maintainer
# opens it: only the five files, every hash, both cases playable, 2 MB at most. It also checks each commit carries a
# Signed-off-by line (the Developer Certificate of Origin in CONTRIBUTING.md).
on:
  pull_request:
    paths: ["lessons/incoming/**"]
permissions:
  contents: read
jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run kei share check lessons/incoming --allow-none
      - name: Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "commit $c has no Signed-off-by line (see CONTRIBUTING.md, or set share.sign_off = on)"
              missing=1
            fi
          done
          exit $missing
