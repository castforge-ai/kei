name: lessons
# A pull request that adds a shared lesson gets the same bundle checks the review page runs, before a maintainer
# opens it: only the five files, every hash, both cases playable, 2 MB at most. The Signed-off-by line of every commit
# (the Developer Certificate of Origin in CONTRIBUTING.md) is checked on every pull request by dco.yml.
on:
  pull_request:
    paths: ["lessons/incoming/**"]
permissions:
  contents: read
jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - run: uv run kei share check lessons/incoming --allow-none
