# Kei's settings. kei settings lists every value here with its meaning, and kei settings set <key> <value>
# changes one safely (checked before it is saved, comments kept); the review page has a Settings tab too.

# Every claude seat runs isolated from the user's own Claude Code setup, so nothing private reaches the shot files:
#   --safe-mode                    no CLAUDE.md, memory, skills, plugins, hooks, MCP servers, agents or custom commands
#   --setting-sources project,local  the user's own settings file (~/.claude/settings.json) is not read
#   --strict-mcp-config            no MCP server unless one is given with --mcp-config
#   --disable-slash-commands       no skill or command can be called
# One thing these flags cannot hide: the signed-in account's e-mail address, which Claude Code itself puts in the
# context. Only an API key (--bare with ANTHROPIC_API_KEY) avoids it. See "Seats and privacy" in the README.
# Each seat's command line is the agent's own: run "claude --help" or "codex exec --help" to check the flags.

# The agent that animates. Kei sends each stage's prompt on stdin.
# --permission-mode acceptEdits lets it write the stage's files without asking; --add-dir .. lets it reach the
# folder that holds the shot folder: GROWTH.md, and, in a character folder, the other shots' REFS.md drafts.
# In -p mode acceptEdits alone refuses every shell command, and the stages need a few: kei render, kei bake,
# kei check and kei pose, python for the animator's own helper scripts (only those in .kei/scratch/: no one-liners,
# so every helper is kept and counted), ffmpeg and ffprobe for videos. --allowedTools allows
# exactly those, in the Bash and the PowerShell tool (Claude Code on Windows may use either), and nothing else.
# Kei puts its own scripts folder first on the seat's PATH, so "kei" and "python" are this Kei's.
[animator]
# model = "opus"     # the seat's model and effort, as fields (claude and codex seats); Kei adds the CLI's own flags
# effort = "high"
cmd = ["claude", "-p", "--output-format", "json", "--permission-mode", "acceptEdits", "--add-dir", "..",
       "--safe-mode", "--setting-sources", "project,local", "--strict-mcp-config", "--disable-slash-commands",
       "--allowedTools",
       "Bash(kei *),Bash(python .kei/scratch/*),Bash(ffmpeg *),Bash(ffprobe *),PowerShell(kei *),PowerShell(python .kei/scratch/*),PowerShell(ffmpeg *),PowerShell(ffprobe *)"]
timeout_s = 1800

# Critic seats: a separate reviewer that never edits. Any agent CLI; several allowed; any send-back wins.
# A run with no critic does not start: the agent that animates never reviews its own work.
[[critics]]
name = "claude-critic"
cmd = ["claude", "-p", "--output-format", "json", "--permission-mode", "plan",
       "--safe-mode", "--setting-sources", "project,local", "--strict-mcp-config", "--disable-slash-commands"]
# fallback_cmd = ["codex", "exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "-"]
#   a stand-in that answers for this critic when it hits a usage limit, so the stage goes on

[[critics]]
name = "codex"
# --ignore-user-config, --ignore-rules and --ephemeral: no user config.toml (so no MCP servers from it), no execpolicy
# rules, no saved session. Codex still lists the user's own skills (in ~/.codex/skills): no flag removes them.
# -c windows.sandbox="unelevated": on Windows the read-only sandbox cannot start without it (it would ask for an
# administrator set-up). The setting only matters on Windows.
cmd = ["codex", "exec", "--json", "--sandbox", "read-only", "--skip-git-repo-check", "--ignore-user-config", "--ignore-rules",
       "--ephemeral", "-c", 'windows.sandbox="unelevated"', "-"]

# Web access: the seats may search the web and read pages to look for references (papers, and clips linked at a
# timestamp, never downloaded). kei init asks once and writes the answer here; a kei.toml without it is asked at the
# next kei run. on adds WebSearch and WebFetch to a Claude Code seat and --search to a Codex seat; off refuses both.
# [seats]
# web = "on"          # on | off

[limits]
max_attempts = 3      # tries per stage before the shot stops for a human
max_send_backs = 3    # critic send-backs per stage before the shot stops for a human
# on_send_back_limit = "stop"   # stop | retry (again from attempt 1, up to auto_retries) | advance (open notes to sign-off)
# auto_retries = 2
# retry_note = "..."            # what the animator reads on an automatic retry
# [limits.passes]               # a stage's own limits, over the ones above (any stage: plan, blocking, passes...)
# max_attempts = 5
# max_send_backs = 5

# The rule book. Each stage and each critic get only the rules of that stage.
# [book]
# path = "book"                  # a topic folder or one file; default: the book that ships with Kei
# lessons = "lessons.local.md"   # your local lessons (kei note writes them); next to this file by default
# max_chars = 450000             # the most rule text one stage may get; over it, the shot stops for a person
# banned_names = "kei.banned.txt"  # your private list of names no shot file may hold, one
#                                  # pattern per line; read from kei.banned.txt next to this file when it exists

# The reference library: a folder of public-domain and openly licensed footage (an INDEX.md, and a SOURCE.md per
# clip with its creator, year, licence, frame rate and view). Kei's seats may read it, and the reference stage takes
# its short look there. Kei ships no footage; a folder kei-refs next to this file is read when it exists.
# [refs]
# library = "kei-refs"

# The shot's character: who Kei animates when the brief names nobody. A brief picks one with a line
# "Character: <name>" in PLAN.md, and a shot.json may name one with "character". The known characters are the
# files in kei/characters/ (kei, keira).
[shot]
character = "kei"

[share]
mode = "ask"          # ask | always | never | auto: what Kei does with new lessons when you accept a shot
# repo = "castforge-ai/kei"   # where lessons go (owner/name); a studio names its own repository here
# sign_off = "on"    # each shared lesson carries your Signed-off-by line (you agree to the DCO in CONTRIBUTING.md)

# Where the keys live: Kei's own rig ("kei"), or Maya ("maya"; also kei run --app maya). With Maya open, a Maya
# shot asks where to animate: in the open Maya (through the Kei host, see kei maya shelf) or in the background (Maya
# with no window, on a copy in the shot folder). session = "open" or "background" answers in advance.
# The live page: kei run starts a page on 127.0.0.1 that follows the shot as Kei works (the stage, the key poses of
# each try, the critics' notes on their frames, the references, the renders). It reads the shot and changes nothing.
[live]
page = "on"           # on | off
open = "on"           # on: the browser opens it when it starts | off: Kei only prints the link

[apps]
app = "kei"

[apps.maya]
session = "ask"       # ask | open | background
# mayapy = "C:/Program Files/Autodesk/Maya2027/bin/mayapy.exe"   # default: KEI_MAYAPY, else the newest Maya found

# Blender ("blender"; also kei run --app blender): Kei keys its character's key poses in a background Blender (no
# window), legs on IK, and reads the joints Blender plays back for every check.
# [apps.blender]
# path = "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe"   # default: KEI_BLENDER, else the newest found

# Unreal ("unreal"; also kei run --app unreal): Kei keys your character's Control Rig in your open Unreal Editor,
# through the Claireon plugin (kei unreal setup lists the steps). Kei asks which open editor to use unless
# session = "open" and exactly one answers. Kei talks to 127.0.0.1 only.
[apps.unreal]
session = "ask"       # ask | open
# project = "C:/Projects/MyGame"                  # the folder with the .uproject: Kei reads the editor's port there
# url = "http://127.0.0.1:50000/mcp"              # or name the Claireon server directly
# mesh = "/Game/Characters/Mannequins/Meshes/SKM_Manny_Simple"   # only when the project has several characters
# control_rig = "/Game/Characters/Mannequins/Rigs/CR_Mannequin_Body"
# mesh_review = "on"     # the critics judge each pass on the real mesh, rendered by the editor (off: line drawings only)
# mesh_timeout = 1200    # seconds Kei waits for that render
